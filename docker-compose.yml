name: frotaprime

services:
  db:
    image: postgres:16-alpine
    environment:
      USER: postgres
      PASSWORD: frotaprime
      DATABASE: frotaprime
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Via TCP: durante a inicialização a imagem sobe um servidor temporário só com socket
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build: ./api
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgresql:frotaprime@db:5432/frotaprime?schema=public
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./api/prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/src
        - action: rebuild
          path: ./api/package.json
        - action: rebuild
          path: ./api/package-lock.json

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json

volumes:
  db_data:
