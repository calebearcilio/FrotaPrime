name: frotaprime

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frotaprime}
      POSTGRES_DB: ${POSTGRES_DB:-frotaprime}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build: ./api
    environment:
      API_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-frotaprime}@db:5432/${POSTGRES_DB:-frotaprime}?schema=public
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./api/prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/src
        - action: rebuild
          path: ./api/package.json
        - action: rebuild
          path: ./api/package-lock.json

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json

volumes:
  db_data:
